services:
  api:
    image: broker-api
    container_name: broker-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    depends_on:
      - mongo

  web:
    image: broker-web
    container_name: broker-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - api

  mongo:
    image: mongo:7
    container_name: broker-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
