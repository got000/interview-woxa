services:
  redis:
    image: redis:7-alpine
    container_name: broker-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data

  api:
    image: ghcr.io/got000/broker-api:prod
    container_name: broker-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env.prod
    depends_on:
      - redis

  web:
    image: ghcr.io/got000/broker-web:prod
    container_name: broker-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.prod
    depends_on:
      - api

volumes:
  redis_data:
